<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل شروحات المحطة</title>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* تصميم زر الإضافة الرئيسي */
        .header-actions {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #218838;
        }
        /* تصميم شبكة المربعات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* تصميم المربع الواحد */
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #eef2f3;
        }
        .card h3 {
            margin: 0;
            color: #007bff;
        }
        /* تصميم النوافذ المنبثقة (Modals) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .close-btn:hover {
            color: #000;
        }
        /* تنسيق حقول الإدخال في نموذج الإضافة */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-save {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>دليل شروحات المحطة</h1>

    <!-- زر إضافة شرح جديد -->
    <div class="header-actions">
        <button class="btn-add" onclick="openAddModal()">+ إضافة شرح جديد</button>
    </div>

    <!-- مكان عرض المربعات -->
    <div id="cardsGrid" class="grid-container">
        <p style="text-align: center; grid-column: 1/-1;">جاري تحميل البيانات...</p>
    </div>

    <!-- نافذة عرض الشرح التفصيلي (عند الضغط على المربع) -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalBody" style="line-height: 1.6; white-space: pre-wrap;"></p>
        </div>
    </div>

    <!-- نافذة إضافة شرح جديد (نموذج الإدخال) -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addModal')">&times;</span>
            <h2>إضافة شرح جديد</h2>
            <div class="form-group">
                <label for="newTitle">عنوان الشرح (اسم المربع):</label>
                <input type="text" id="newTitle" placeholder="مثلاً: طريقة تركيب كونترولر...">
            </div>
            <div class="form-group">
                <label for="newContent">تفاصيل الشرح:</label>
                <textarea id="newContent" placeholder="اكتب الشرح هنا بالتفصيل..."></textarea>
            </div>
            <button class="btn-save" onclick="saveNewTutorial()">حفظ في قاعدة البيانات</button>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase (تأكد من وضع بياناتك هنا)
        const SUPABASE_URL = 'https://nitlxllguhmtoqdsxkjk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdGx4bGxndWhtdG9xZHN4a2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ0ODgsImV4cCI6MjEwNjQ1MDQ4OH0.86WAFHofWRzcsOXX0gUTho9DyLXlPNw0j9pBOcaRySw';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // دالة لجلب البيانات وعرضها
        async function fetchTutorials() {
            const { data, error } = await _supabase.from('tutorials').select('*').order('id', { ascending: false });
            const grid = document.getElementById('cardsGrid');
            
            if (error) {
                grid.innerHTML = '<p style="color:red; text-align:center;">حدث خطأ أثناء جلب البيانات</p>';
                console.error(error);
                return;
            }

            grid.innerHTML = '';
            
            if (data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد شروحات مضافة حالياً.</p>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${item.title}</h3>`;
                card.onclick = () => openDetailModal(item.title, item.content);
                grid.appendChild(card);
            });
        }

        // دالة حفظ البيانات الجديدة في Supabase
        async function saveNewTutorial() {
            const title = document.getElementById('newTitle').value.trim();
            const content = document.getElementById('newContent').value.trim();

            if (!title || !content) {
                alert('الرجاء إدخال العنوان والشرح معاً!');
                return;
            }

            // إرسال البيانات للجدول
            const { error } = await _supabase
                .from('tutorials')
                .insert([{ title: title, content: content }]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ!');
                console.error(error);
            } else {
                alert('تم الحفظ بنجاح!');
                // تفريغ الحقول وإغلاق النافذة
                document.getElementById('newTitle').value = '';
                document.getElementById('newContent').value = '';
                closeModal('addModal');
                // إعادة تحميل المربعات لتظهر الإضافة الجديدة فوراَ
                fetchTutorials();
            }
        }

        // دوال النوافذ المنبثقة
        function openDetailModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = content;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // إغلاق النوافذ عند النقر خارجها
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // تشغيل الدالة عند تحميل الصفحة
        fetchTutorials();
    </script>

</body>
</html>
